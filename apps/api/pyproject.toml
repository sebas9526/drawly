[project]
name = "drawly-api"
version = "0.1.0"
description = "Drawly FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlmodel>=0.0.22,<0.1",
  "alembic>=1.14,<1.15",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "asyncpg>=0.30,<0.31",
  "psycopg[binary]>=3.2,<3.3",
  "argon2-cffi>=23.1,<24",
  "pyjwt>=2.10,<3",
  "openpyxl>=3.1,<3.2",
  "reportlab>=4.2,<4.3",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "black>=24.10,<25",
  "greenlet>=3.5.3",
  "httpx>=0.28,<0.29",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<0.9",
  "types-openpyxl>=3.1.5.20260518",
  "types-reportlab>=4.5.1.20260521",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
